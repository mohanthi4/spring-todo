services:
  todo:
    build: .
    environment:
      TODO_MONGO_URI: mongodb://mongo:27017/tododb
    depends_on:
      - mongo
    ports:
      - "8080"
    deploy:
      replicas: 3
    networks:
      - backend

  mongo:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - backend

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - todo
    networks:
      - backend

volumes:
  mongo_data:

networks:
  backend:
    driver: bridge